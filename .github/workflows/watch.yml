name: site-watch
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency:
  group: site-watch
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Restore last status
        uses: actions/cache/restore@v4
        with:
          path: state
          key: sitewatch-${{ github.run_id }}
          restore-keys: sitewatch-
      - name: Check the site
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: python3 watch.py
      - name: Save status
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: sitewatch-${{ github.run_id }}
